# 雙11 (Double 11) switch: when the sale shows, when the /promo/hmg/ A/B split starts, and the
# preview token. Included by nginx.conf in the http context; the Dockerfile copies this file to
# /etc/nginx/d11.conf and keeps it out of the web root. Tests swap this one file.
#
# $time_iso8601 is the container's local time. The nginx:alpine image runs on UTC, so it reads
# like "2026-10-25T16:00:00+00:00" (= 26 Oct 00:00 in Hong Kong). The patterns accept that UTC
# form and also the "+08:00" form, in case the host ever sets TZ to Hong Kong time.

# 雙11 prices on: 2026-10-26 00:00:00 to 2026-11-16 23:59:59 Hong Kong time (UTC+8).
map $time_iso8601 $d11_clock {
    default                                          0;
    "~^2026-10-25T(1[6-9]|2[0-3]):[0-9:]+\+00:00$"  1;   # 26 Oct 00:00-07:59 HKT, in UTC
    "~^2026-10-(2[6-9]|3[01])T"                      1;   # 26-31 Oct
    "~^2026-11-(0[1-9]|1[0-5])T"                     1;   # 1-15 Nov
    "~^2026-11-16T(0[0-9]|1[0-5]):[0-9:]+\+00:00$"  1;   # 16 Nov 08:00-23:59 HKT, in UTC
    "~^2026-11-16T[0-9:]+\+08:00$"                   1;   # 16 Nov, on Hong Kong time
}

# The /promo/hmg/ A/B split runs from 2026-10-26 00:00:00 Hong Kong time and does not stop on its
# own (after 16 Nov the owner decides). Before that everyone gets version A and no cookie is set.
map $time_iso8601 $ab_clock {
    default                                          0;
    "~^2026-10-25T(1[6-9]|2[0-3]):[0-9:]+\+00:00$"  1;
    "~^2026-10-(2[6-9]|3[01])T"                      1;
    "~^2026-1[12]-"                                  1;
    "~^20(2[7-9]|[3-9][0-9])-"                       1;
}

# ?d11=<token> shows the 雙11 prices on that one request, at any time (a preview). Any other
# value is ignored. Map strings match without regard to case, so the token is lower case.
map $arg_d11 $d11_preview {
    default         0;
    3txvegbgjug3    1;
}
