# 雙11 (Double 11) sale switch. /etc/nginx/d11.conf (repo: nginx-d11.conf) sets, by the clock:
#   $d11_clock    1 while the sale runs (26 Oct 00:00 - 16 Nov 23:59:59 HKT)
#   $ab_clock     1 once the /promo/hmg/ A/B split has started (26 Oct 00:00 HKT, no end)
#   $d11_preview  1 when the request carries ?d11=<token>
include /etc/nginx/d11.conf;

# 雙11 is on for this request: by the clock, or forced by the preview token
map "$d11_clock$d11_preview" $d11_on {
    "00"    0;
    default 1;
}
# The pages that follow the sale get this added to their <html> tag (sub_filter below); the
# page carries both the normal and the 雙11 words and css/d11.css shows one set from it.
map $d11_on $d11_attr {
    1       ' data-offer="d11"';
    default '';
}

# /promo/hmg/ A/B test: one URL, nginx picks version a (index.html) or b (b.html).
# Precedence: ?v=a|b (preview, any time) > cookie hmgv=a|b (a returning visitor) > 50/50 random.
# Before the split starts ($ab_clock 0) everyone without ?v= gets a and no cookie is set.
# These map / split_clients lines sit in the http context (this file is included there).
split_clients "${request_id}" $hmg_rand {
    50%     a;
    *       b;
}
map $arg_v $hmg_q {
    a       a;
    b       b;
    default "";
}
map $cookie_hmgv $hmg_c {
    a       a;
    b       b;
    default "";
}
map $hmg_c $hmg_remembered {
    ""      $hmg_rand;
    default $hmg_c;
}
map $ab_clock $hmg_auto {
    1       $hmg_remembered;
    default a;
}
map $hmg_q $hmg_variant {
    ""      $hmg_auto;
    default $hmg_q;
}
# The 30-day cookie only once the split runs (an empty add_header value sends no header)
map $ab_clock $hmg_cookie {
    1       "hmgv=$hmg_variant; Path=/promo/hmg/; Max-Age=2592000; SameSite=Lax; Secure";
    default "";
}
map $hmg_variant $hmg_file {
    b       b.html;
    default index.html;
}
# /promo/hmg/b.html?utm_x=... -> /promo/hmg/?v=b&utm_x=... (other tags ride along)
map $args $hmg_more_args {
    ""      "";
    default "&$args";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Dotfiles (.git, .gitignore, .claude ...) are never served. First regex location, so
    # it wins over the asset rules below; real pages never have a "/." in their path.
    location ~ /\. {
        deny all;
        return 404;
    }
    # The build files (Dockerfile, nginx.conf, the 雙11 switch file) answer 404, not the home
    # page fallback, even if a future Dockerfile stops deleting them from the web root
    location ~ ^/(Dockerfile|nginx\.conf|nginx-d11\.conf|d11\.conf)$ {
        return 404;
    }

    # Cache static assets aggressively
    location ~* \.(css|js|webp|png|jpg|jpeg|svg|ico|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Video files — cache but allow revalidation
    location ~* \.(mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The pages that follow the 雙11 switch: the TC home, /imuglo/, /tiger-milk-king/ (here) and
    # /promo/hmg/ (below). sub_filter adds data-offer="d11" to the <html> tag while the sale is
    # on. Their HTML is never cached past the switch moment: no-cache makes the browser ask every
    # time, and with no ETag / Last-Modified (etag off; sub_filter drops Last-Modified) and
    # if_modified_since off, nginx never answers 304 from the unchanged file on disk.
    # add_header inside a location REPLACES the server-level add_headers, so the security
    # headers are repeated here on purpose.
    location = / {
        sub_filter '<html lang="zh-Hant-HK" dir="ltr">' '<html lang="zh-Hant-HK" dir="ltr"$d11_attr>';
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }
    # also the address every unknown path falls back to (location / below)
    location = /index.html {
        sub_filter '<html lang="zh-Hant-HK" dir="ltr">' '<html lang="zh-Hant-HK" dir="ltr"$d11_attr>';
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }
    location /imuglo/ {
        sub_filter '<html lang="zh-Hant-HK" dir="ltr">' '<html lang="zh-Hant-HK" dir="ltr"$d11_attr>';
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
    location /tiger-milk-king/ {
        sub_filter '<html lang="zh-Hant-HK" dir="ltr">' '<html lang="zh-Hant-HK" dir="ltr"$d11_attr>';
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # EN version
    location /en/ {
        try_files $uri /en/index.html =404;
    }
    location = /en {
        return 301 /en/;
    }

    # Policy pages
    location /policies/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Promo landing pages (ad traffic) — never indexed, never compete with the brand site.
    # add_header inside a location REPLACES the server-level add_headers, so the security
    # headers are repeated here on purpose.
    location = /promo/campaign.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    # The A/B test URL. The file is served from this location (try_files, no redirect), so the
    # address bar and every query string (utm_*, fbclid) stay as they came; the cookie keeps
    # a visitor on the same version for 30 days; private + Vary: Cookie keep caches from
    # handing one visitor's version to another. no-store also keeps the 雙11 switch exact.
    location = /promo/hmg/ {
        sub_filter '<html lang="zh-Hant-HK" dir="ltr">' '<html lang="zh-Hant-HK" dir="ltr"$d11_attr>';
        etag off;
        if_modified_since off;
        add_header Set-Cookie $hmg_cookie always;
        add_header Cache-Control "private, no-store" always;
        add_header Vary "Cookie" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /promo/hmg/$hmg_file =404;
    }
    location = /promo/hmg {
        absolute_redirect off;
        return 301 /promo/hmg/$is_args$args;
    }
    # Version A's file by its own name: no split, but the same 雙11 switch
    location = /promo/hmg/index.html {
        sub_filter '<html lang="zh-Hant-HK" dir="ltr">' '<html lang="zh-Hant-HK" dir="ltr"$d11_attr>';
        etag off;
        if_modified_since off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    # Version B is never an address of its own
    location = /promo/hmg/b.html {
        absolute_redirect off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 301 /promo/hmg/?v=b$hmg_more_args;
    }
    location /promo/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
